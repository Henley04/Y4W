[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "y4w"
version = "0.2.2"
description = "Windows-native YuE2 OrbitQuant W4A4 inference engine with CUDA / TensorRT-RTX / Vulkan backends"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-4.0" }
authors = [{ name = "Henley04" }]
keywords = ["yue2", "orbitquant", "w4a4", "inference", "windows", "cuda", "tensorrt", "vulkan", "music-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Programming Language :: CUDA",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "safetensors>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "httpx>=0.24", "fastapi>=0.100"]
hub = ["modelscope>=1.20", "soundfile>=0.12"]
# One-command service: REST API (fastapi/uvicorn) + Gradio WebUI.
# The API works even if gradio is omitted; the WebUI is optional on top.
serve = ["fastapi>=0.100", "uvicorn>=0.20", "httpx>=0.24", "gradio>=4.0"]
all = ["pytest>=7.0", "httpx>=0.24", "modelscope>=1.20",
       "soundfile>=0.12", "fastapi>=0.100", "uvicorn>=0.20", "gradio>=4.0"]

[project.scripts]
y4w = "y4w.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["y4w*"]

# Ship native source / docs inside the wheel so downstream users can build the
# optional CUDA extension and read Windows build instructions offline.
[tool.setuptools.package-data]
"y4w.kernels" = ["*.cu", "*.md"]
"y4w.tests" = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["y4w/tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "cuda: requires an NVIDIA CUDA GPU",
    "slow: long running test",
]

[tool.y4w]
default_backend = "auto"
