name: Release

# Publish sdist + wheel to a GitHub Release.
# Trigger: push a tag like `v0.1.0`, or run manually with a version input.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $v = "${{ inputs.version }}"
          } else {
            $v = $env:GITHUB_REF_NAME
          }
          if ($v -notmatch '^v\d') { throw "Release tag must start with 'v' (got '$v')" }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $v"

      - name: Install build tooling
        run: python -m pip install --upgrade pip setuptools wheel build

      - name: Build sdist + wheel
        run: python -m build

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name, Length -AutoSize

      - name: Verify wheel layout
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          if (-not $wheel) { throw "no wheel built" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($wheel.FullName)
          $names = $zip.Entries.FullName
          $zip.Dispose()
          $need = @(
            'y4w/backends/cuda.py',
            'y4w/backends/tensorrt_rtx.py',
            'y4w/backends/vulkan.py',
            'y4w/server/app.py',
            'y4w/kernels/w4a4_native.cu'
          )
          foreach ($n in $need) {
            if (-not ($names -contains $n)) { throw "wheel missing $n" }
          }
          Write-Host "release wheel layout OK"

      - name: Create GitHub Release and upload artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.tag.outputs.value }}"
          gh release create $tag dist/* `
            --title "Y4W $tag" `
            --generate-notes
          Write-Host "release $tag created"
